<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Sleek &mdash; demo</title>
  <link rel="stylesheet" href="showcase.css">
  <style>
    .card { padding: 1rem; border-radius: 12px; }
  </style>
</head>
<body class="page dark" data-theme="ember">
  <!-- A comment in the markup -->
  <header id="top">
    <h1 class="title">Warm &amp; minimal</h1>
    <nav aria-label="Main">
      <a href="#install" class="link active">Install</a>
      <a href="https://github.com/KernNull/claude-sleek" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>
  <main>
    <section id="install" class="card">
      <p>Search for <code>Claude Sleek</code> in the Extensions view.</p>
      <button type="button" disabled onclick="install(3)">Install &#10003;</button>
    </section>
  </main>
  <script>
    function install(count = 1) {
      const message = `Installing ${count} theme(s)`;
      console.log(message);
    }
  </script>
</body>
</html>
